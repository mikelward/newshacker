name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly dependency PR is opened by `GITHUB_TOKEN`, and GitHub does not
  # let a `GITHUB_TOKEN`-created event start a workflow — so `pull_request`
  # never fires for it. `workflow_dispatch` is the documented exception, and
  # `dependency-update.yml` dispatches this workflow against the branch it
  # pushes. Removing this leaves that PR with no CI and nothing to say so.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage floor)
        run: npm run test:coverage

      - name: Build
        run: npm run build
