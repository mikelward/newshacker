name: npm update

# One batched dependency PR per week instead of one PR per dependency as soon
# as it ships. Dependabot and Renovate both defaulted to the latter, which on a
# repo this size is a feed to babysit rather than a chore to do — and every
# extra PR was an independent chance to get something wrong. See AGENTS.md
# "Dependency updates".
#
# `npm update` moves each dependency to the newest version ALLOWED BY THE RANGE
# ALREADY IN package.json, so a DIRECT dependency cannot cross a major: the
# publish job re-derives that from the diff and stops the run if one did.
# Majors stay a deliberate, human-initiated migration.
#
# Beneath package.json the promise is weaker. A subdependency whose own range
# is `*` or `>=x` can take a major without anything showing up in the
# package.json diff, and the lockfile check below catches the ordinary shapes
# of that but is explicitly not exact — see its own comment for what it does
# and does not cover. Read "no majors" as guaranteed for what package.json
# declares, best-effort beneath it.

on:
  schedule:
    # 06:17 UTC on Saturdays. Actions cron is best-effort and can be delayed by
    # tens of minutes under load, which is fine for a weekly chore — and the
    # off-the-hour minute is deliberate, since the top of the hour is the most
    # congested slot on the shared scheduler and the most likely to be delayed.
    - cron: '17 6 * * 6'
  workflow_dispatch:

# No permissions at the workflow level. The job that runs unreviewed dependency
# code gets a read-only token; only the publish job, which runs none, can write.
permissions: {}

concurrency:
  group: npm-update
  cancel-in-progress: false

jobs:
  # Runs `npm update` and the checks. Third-party code executes here, so this
  # job holds no write token and cannot push anything.
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      passed: ${{ steps.checks.outputs.passed }}
      base: ${{ steps.base.outputs.sha }}
      pkg_sha: ${{ steps.changed.outputs.pkg_sha }}
      lock_sha: ${{ steps.changed.outputs.lock_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always the default branch, never the dispatch ref. `workflow_dispatch`
          # exposes a Branch dropdown, and checkout would otherwise follow that
          # selection — so a manual run from a feature branch would base the
          # dependency branch on it and open a PR against the default branch
          # carrying that branch's commits as well as the update. The scheduled
          # path already defaults here; this makes both paths identical. (If the
          # expression is ever empty, checkout falls back to the default branch
          # anyway, so the failure mode is benign.)
          ref: ${{ github.event.repository.default_branch }}

          # `npm update` and every check below execute lifecycle scripts
          # (postinstall, prepare) from dependency versions nobody has reviewed
          # yet — inherent to testing an update. This job's token is read-only,
          # so the credential checkout would otherwise persist in .git/config
          # can't push; dropping it anyway keeps one less credential in reach of
          # code we haven't read, and keeps this correct if the permissions
          # block is ever widened.
          persist-credentials: false

      # Pinned and handed to the publish job. Publishing from "the default
      # branch" instead would take whatever the tip is by then — if someone
      # lands a package.json or lockfile commit in between, the artifact would
      # overlay dependency files resolved and tested against the older base and
      # silently revert it, while the PR body reported checks from that older
      # base.
      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read the major from .nvmrc rather than repeating it here, same
          # single-source rule ci.yml follows.
          node-version-file: .nvmrc
          cache: npm

      # `.nvmrc` holds a bare major and setup-node may serve a CACHED Node 24,
      # whose bundled npm can predate 11.10.0 — the release that added
      # `min-release-age`. Below that npm silently ignores .npmrc's cooldown
      # ("Unknown project config") and this job would resolve packages the repo
      # deliberately holds back, with no error anywhere. engines.npm is only
      # advisory without engine-strict, so declare-and-hope is not enough:
      # check what the runner actually has and raise it if short.
      - name: Ensure an npm that honors the .npmrc cooldown
        run: |
          set -euo pipefail
          floor=$(node -p "require('./package.json').engines.npm.replace(/^>=/, '')")
          if [ "$(printf '%s\n%s\n' "$floor" "$(npm -v)" | sort -V | head -n1)" != "$floor" ]; then
            echo "npm $(npm -v) predates $floor, which .npmrc's cooldown needs; installing npm@$floor"
            # --ignore-scripts for the same reason as every other install
            # in this window: nothing unreviewed runs before the fingerprints.
            npm install -g --ignore-scripts "npm@$floor"
          fi
          npm -v

      # Truncating $GITHUB_PATH/$GITHUB_ENV is what keeps a lifecycle script's
      # reach inside the step that ran it: the runner applies those files to
      # LATER steps in the job, so a postinstall can otherwise put a fake `npm`
      # ahead of the real one for everything below. Emptying them here means the
      # runner applies nothing. It closes that channel — it does not make the
      # checks trustworthy in general (see AGENTS.md), since the same package
      # code is loaded into the test process either way.
      - name: Install from the lockfile
        run: |
          set -euo pipefail
          # `--ignore-scripts` here too, and for the same reason the resolve
          # step below has it: this runs BEFORE the fingerprints exist, so a
          # postinstall from a package already in the lockfile could rewrite a
          # `resolved` URL or an `integrity` hash and have that rewrite be what
          # gets fingerprinted and published. Versions and majors would look
          # untouched, so neither the range check nor the major check would see
          # it. The real install, with scripts, is the first reported check —
          # after the manifests are pinned.
          npm ci --ignore-scripts
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # `--ignore-scripts` so the manifests are RESOLVED before any newly
      # selected package gets to run code. Without it, a postinstall from a
      # version this run just picked could rewrite package-lock.json during
      # this step and that rewrite would become the trusted snapshot — the
      # comparison after the checks would compare a poisoned file to itself.
      # The real install happens below, once there is something to snapshot.
      - name: Resolve updates within their declared ranges
        run: npm update --save --ignore-scripts

      - name: Stop early if nothing moved
        id: changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency updates available this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            # Captured now, while the change is still uncommitted. The clone is
            # shallow, so after committing there is no reliable second commit to
            # diff against.
            git diff --stat -- package.json > deps-stat.txt
            # Fingerprint now, before any check runs. The checks execute
            # dependency code, which could rewrite these files afterwards —
            # widening a range, repointing a lockfile `resolved` URL — and the
            # filename allowlist would wave it through as "expected".
            #
            # A step OUTPUT, not a file. A copy under /tmp would sit on the same
            # disk as the code it guards, owned by the same user, at a path
            # anything can guess — a lifecycle script could rewrite the manifest
            # and its snapshot together and the comparison would pass. The
            # runner captures $GITHUB_OUTPUT when this step ends and hands the
            # value to later steps and to the publish job; nothing that runs
            # afterwards can reach back and change it.
            echo "pkg_sha=$(sha256sum package.json | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
            echo "lock_sha=$(sha256sum package-lock.json | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
            git diff --stat -- package.json package-lock.json >> "$GITHUB_STEP_SUMMARY"
          fi

      # The PR this job opens is authored by GITHUB_TOKEN, and GitHub
      # deliberately does NOT trigger `on: pull_request` workflows for those —
      # it is the loop-prevention rule, and it has no per-repo opt-out short of
      # a PAT. So ci.yml will NOT run on the update PR: the checks have to
      # happen HERE or they do not happen at all, and a PR with no red tick
      # would read as verified when nothing had verified it.
      #
      # Every check runs even after one fails, so the PR body reports the whole
      # picture rather than only the first thing to break.
      - name: Run the full check suite
        if: steps.changed.outputs.changed == 'true'
        id: checks
        run: |
          set +e
          failed=0
          : > checks.md
          check() {
            echo "::group::$1"
            eval "$1"
            rc=$?
            echo '::endgroup::'
            if [ $rc -eq 0 ]; then
              echo "- ✅ \`$1\`" >> checks.md
            else
              echo "- ❌ \`$1\` (exit $rc)" >> checks.md
              failed=1
            fi
          }
          # The real install, with lifecycle scripts, so everything below runs
          # against the tree a consumer of this lockfile would get. It goes
          # THROUGH check() rather than in a step of its own: as a step, a
          # postinstall that fails would kill the job before the artifact
          # existed, and the whole batch would surface only as a red Actions run
          # nobody is looking at. As a check it lands in the body with the rest,
          # and the PR still opens saying which package broke.
          check 'npm ci'
          check 'npm run lint'
          check 'npm run typecheck'
          check 'npm run test:coverage'
          check 'npm run build'
          cat checks.md >> "$GITHUB_STEP_SUMMARY"
          if [ $failed -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi
          # Every check above ran dependency code, so this step owes the same
          # containment as the installs: the verify step below invokes `git` and
          # `sha256sum`, and a planted pair on $GITHUB_PATH would let source
          # edits through the check whose entire job is catching them.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # The checks above and the commit below have to describe the SAME tree.
      # The commit stages package files by name (so a planted edit can't ride
      # along), but that cuts the other way too: a lifecycle script could edit
      # source or tests, let the suite pass on THAT tree, and have the edit
      # dropped at commit time — leaving the PR body reporting checks for a tree
      # nobody is merging. Since this PR never gets a normal `pull_request` CI
      # run, that report is all a reviewer has.
      #
      # Anything outside the dependency files is a stop, not something to strip
      # silently: a dependency that rewrites your source during install or test
      # is a decision for a human.
      - name: Verify only dependency files changed
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # `git status`, not `git diff`: diff only sees TRACKED changes, so an
          # untracked file a lifecycle script drops into the tree — one that
          # tsc/vite/vitest would happily pick up — would sail past it while the
          # suite ran against it. Ignored paths (node_modules, dist, coverage)
          # are excluded by porcelain already; the two allowed extras are files
          # this job writes itself.
          unexpected=$(git status --porcelain --untracked-files=all \
            | sed 's/^...//' \
            | grep -Ev '^(package\.json|package-lock\.json|checks\.md|deps-stat\.txt)$' || true)
          if [ -n "$unexpected" ]; then
            echo '::error::Dependency code touched files outside the dependency manifests. Not opening a PR — inspect these before trusting this batch:'
            echo "$unexpected"
            exit 1
          fi

          # IGNORED paths, as a SEPARATE pass — because the most dangerous plant
          # is precisely an ignored one, and the command above structurally
          # cannot see it. `.env.local` is gitignored here (`*.local`, `.env.*`)
          # and Vite LOADS it during a build, so a postinstall writing one
          # injects `VITE_*` values straight into the shipped bundle while the
          # tree still reads as clean.
          #
          # A separate pass rather than adding `--ignored` above, and that is
          # not a style choice: `--ignored` TOGETHER WITH `--untracked-files=all`
          # lists every ignored file individually, so the output becomes the
          # whole of node_modules — megabytes, and unusable. On its own,
          # `--ignored` collapses a fully-ignored directory to one entry
          # (`!! node_modules/`), which is what makes looking at ignored paths
          # affordable at all. Keep the two calls apart.
          #
          # The allowlist is build OUTPUTS, measured rather than guessed: a full
          # suite run leaves `dist/` and `node_modules/` here, plus
          # `*.tsbuildinfo` in newshacker and `coverage/` in gedmap. The near
          # neighbours the .gitignore already names (`dist-ssr`, `dev-dist`) are
          # listed too, so a build-config change does not stop the run over an
          # artifact nobody planted. Anything else ignored is something new in
          # the tree, and worth a human look.
          planted=$(git status --porcelain --ignored \
            | grep '^!! ' \
            | sed 's/^!! //' \
            | grep -Ev '^(node_modules/|dist/|dist-ssr/|dev-dist/|coverage/|[^/]*\.tsbuildinfo)$' || true)
          if [ -n "$planted" ]; then
            echo '::error::Dependency code left IGNORED files in the tree. Git would not commit them, but the build would read them — .env.local is loaded by Vite. Not opening a PR — inspect these:'
            echo "$planted"
            exit 1
          fi

          # Nothing may have touched the manifests since npm resolved them.
          # Compared against the fingerprints the resolve step recorded as step
          # outputs — values that live outside this filesystem, so unlike a
          # snapshot file they cannot be rewritten alongside what they guard.
          if [ "$(sha256sum package.json | cut -d" " -f1)" != "${{ steps.changed.outputs.pkg_sha }}" ] \
             || [ "$(sha256sum package-lock.json | cut -d" " -f1)" != "${{ steps.changed.outputs.lock_sha }}" ]; then
            echo '::error::A dependency file changed AFTER npm resolved it — something in the check run rewrote it. Not opening a PR.'
            exit 1
          fi

          # The manifest CONTENT check does not live here — see the publish
          # job's "Re-validate the dependency diff from a clean context". This
          # job has run the updated packages' own code, so an assertion made
          # here about what the manifests CONTAIN is only as honest as the
          # batch. The two checks above still earn their place: a fingerprint
          # recorded as a step output is out of reach even here, and the tree
          # check catches a lifecycle script touching the working tree, which is
          # what a non-adversarial failure actually looks like.

      # Hand the result to the publish job as data. The install steps truncate
      # $GITHUB_PATH/$GITHUB_ENV so a planted `git` or `gh` cannot reach a later
      # step, but that is a patch on one channel: GitHub-hosted runners give the
      # job passwordless sudo, so nothing done inside this job is equivalent to
      # holding the token on a runner where none of this code ever ran.
      - name: Hand off the dependency diff
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-update
          path: |
            package.json
            package-lock.json
            checks.md
            deps-stat.txt
          retention-days: 1
          if-no-files-found: error

  # Publishes. Runs on a fresh runner, installs nothing, and executes no
  # dependency code — so the write token is never in a machine where an
  # unreviewed package has run.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Dispatching `ci.yml` on the pushed branch is a write to the Actions API.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit the update job tested, not the branch tip.
          ref: ${{ needs.update.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: npm-update

      # The artifact travelled through a machine that ran dependency code, so
      # check it against the fingerprints taken before any of it ran. Those
      # came across as job outputs, which live in the runner's control plane
      # rather than on that machine's disk.
      - name: Check the artifact against the pre-check fingerprints
        run: |
          set -euo pipefail
          [ "$(sha256sum package.json | cut -d" " -f1)" = "${{ needs.update.outputs.pkg_sha }}" ] \
            || { echo '::error::package.json does not match what the update job resolved.'; exit 1; }
          [ "$(sha256sum package-lock.json | cut -d" " -f1)" = "${{ needs.update.outputs.lock_sha }}" ] \
            || { echo '::error::package-lock.json does not match what the update job resolved.'; exit 1; }

      # The authoritative check on what this commit contains, and the reason
      # it lives HERE: everything the update job asserted about the manifests,
      # it asserted on a machine where the updated packages' own code had
      # already run. This job installs nothing and executes no dependency code,
      # so `git show HEAD:package.json` and the downloaded artifact are both out
      # of the batch's reach.
      # The authoritative check on what this commit contains, and the reason
      # it lives HERE: everything the update job asserted about the manifests,
      # it asserted on a machine where the updated packages' own code had
      # already run. This job installs nothing and executes no dependency code,
      # so `git show HEAD:...` and the downloaded artifact are both out of the
      # batch's reach.
      #
      # A checked-in script rather than an inline program, because an inline
      # one is a single-quoted shell argument: one apostrophe in a comment ends
      # the quoting and hands node a TRUNCATED script, which stays valid JS and
      # exits 0 while silently skipping every rule below the cut. That happened
      # here. It also means the rules have unit tests
      # (scripts/check-npm-update.test.ts) instead of being verified by
      # reading them.
      - name: Re-validate the dependency diff from a clean context
        run: node scripts/check-npm-update.mjs

      # Names every package the batch moved, for the PR body. Same clean
      # context as the validation above — and it must stay BEFORE the publish
      # step's commit: the summary diffs the working tree against HEAD exactly
      # as the validator does, so after the commit it would read "no changes".
      - name: Name the updated packages for the PR body
        run: node scripts/check-npm-update.mjs summary > deps-summary.md

      - name: Stop if the default branch moved while the checks ran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='${{ github.event.repository.default_branch }}'
          current=$(gh api "repos/${{ github.repository }}/commits/$branch" --jq .sha)
          if [ "$current" != '${{ needs.update.outputs.base }}' ]; then
            echo "::error::$branch moved from ${{ needs.update.outputs.base }} to $current while the checks ran, so the verified manifests and the branch they would land on no longer match. Re-run the workflow."
            exit 1
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keyed on the RUN DATE, not the month. The job runs weekly, so a
          # month-scoped name would collide with the previous Saturday's branch
          # and every run but the first would fall into the run-scoped fallback
          # below — which works, but that fallback is for a re-run of the same
          # batch, not for a distinct scheduled one.
          today=$(date -u +%Y-%m-%d)
          branch="deps/update-$today"

          if [ '${{ needs.update.outputs.passed }}' = 'true' ]; then
            title="deps: Update dependencies ($today)"
            verdict='All checks passed in the job that produced this branch.'
          else
            title="deps: Update dependencies ($today) — CHECKS FAILING"
            verdict='**One or more checks failed.** Do not merge until they are fixed — the failures are real, not flakes to route around.'
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Never force-push. The PR body tells reviewers to push fixes to this
          # branch — which is also how CI starts running on it — so a re-run on
          # the same day would otherwise overwrite work this job did not
          # create. If today's branch already exists, take a run-scoped one
          # and open its own PR instead of clobbering.
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            branch="$branch-run${{ github.run_number }}"
            echo "Today's branch already exists; using $branch instead." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # Belt and braces. This runner is fresh and nothing has run on it, so
          # there is no hook to plant — but the cost of keeping this is zero and
          # it stays correct if the job ever gains a step.
          git config --global core.hooksPath /dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          # Stage by name. The artifact only carries these files, but naming them
          # keeps that true even if it ever carries more.
          git add -- package.json package-lock.json
          git commit -q -m "$title"
          git push "$remote" "HEAD:refs/heads/$branch"

          # A PR opened by `GITHUB_TOKEN` does not trigger `on: pull_request`
          # workflows — GitHub's loop-prevention rule, with no per-repo opt-out
          # short of a PAT — so nothing would start CI on this branch, and a PR
          # with no red tick reads as verified when nothing verified it.
          # `workflow_dispatch` is the documented EXCEPTION to that rule: a
          # dispatch made with `GITHUB_TOKEN` *does* create a run. So ask for one
          # explicitly against the branch just pushed. Its check runs land on the
          # branch head, which becomes this PR's head, so they appear on the PR
          # like any other. This needs `ci.yml` to carry `workflow_dispatch` ON
          # THE DEFAULT BRANCH — a workflow GitHub cannot see there is not
          # dispatchable, however the branch under test spells it.
          #
          # The PR is created BEFORE the dispatch, with a placeholder body,
          # because the dispatch must name the pull request it reports for:
          # ci.yml's docs lane refuses an anonymous branch dispatch, which is
          # what keeps a dispatched verdict from labeling a commit some other
          # pull request heads. The real body lands right after the dispatch
          # (still composed after it, so it can state what actually happened
          # — the assignee reads the PR, not the run log).
          # Scoped to THIS repository's own branch: `gh pr list --head` filters
          # by bare branch name, which can also match a fork's PR of the same
          # name; the REST head= filter names the owner, so only the branch
          # just pushed here can answer.
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${branch}&state=open" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr_url=$(gh pr create --title "$title" \
              --body 'Opening — the checks report lands in a moment.' \
              --base '${{ github.event.repository.default_branch }}' --head "$branch")
            pr=${pr_url##*/}
          fi

          # Non-fatal either way: the branch is pushed and the PR is open by
          # this point, and the job has already run every check itself, so a
          # failed dispatch must not turn a pushed branch into no PR.
          if gh workflow run ci.yml --ref "$branch" -f pr="$pr"; then
            ci_started=true
          else
            ci_started=false
            echo "Could not start CI on $branch; the PR body says so." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # The consumer check needs the same treatment for the same reason,
          # and it is the one that would silently never report: `ci.yml` at
          # least has this dispatch, while codex-review-check.yml's own
          # triggers are `push` and `pull_request_target`, both suppressed for
          # a GITHUB_TOKEN-authored pull request, and it has no schedule to
          # fall back on the way the codex sweep does. So once the ruleset
          # requires it, a batch without this dispatch would block forever.
          # Its `workflow_dispatch` trigger exists for exactly this call.
          if gh workflow run codex-review-check.yml --ref "$branch"; then
            check_started=true
          else
            check_started=false
            echo "Could not start codex-review-check on $branch; the PR body says so." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "\`npm update --save\` — every dependency moved to the newest version its"
            echo 'existing range in `package.json` allows. **No majors**: those need a'
            echo 'deliberate migration and this job cannot produce one.'
            echo
            echo '## Checks'
            echo
            cat checks.md
            echo
            echo "$verdict"
            echo
            if [ "$ci_started" = true ]; then
              echo '> These ran in the workflow job, not on this PR. A PR opened by'
              echo '> `GITHUB_TOKEN` does not trigger `on: pull_request` workflows, so CI'
              echo '> does not start here on its own — this job dispatched `ci.yml` against'
              echo '> the branch instead, and that run reports on this PR like any other.'
            else
              echo '> **CI could not be started on this branch, so the checks above are the'
              echo '> only ones that ran.** A PR opened by `GITHUB_TOKEN` does not trigger'
              echo '> `on: pull_request` workflows and the explicit dispatch failed, so'
              echo '> nothing else will start it. Push any commit to the branch and CI runs'
              echo '> normally from then on.'
            fi
            # Reported outside the branch above, so a failed CI dispatch cannot
            # hide a failed check dispatch -- they are separate workflows and
            # either can fail alone.
            if [ "$check_started" != true ]; then
              echo
              echo '> **`codex-review-check` could not be dispatched**, so the workflow pin'
              echo '> is unverified on this PR. It cannot start on its own here either, for'
              echo '> the same reason CI cannot. Push any commit to the branch, or re-run'
              echo '> that workflow against it by hand.'
            fi
            echo
            # Which packages moved, direct vs transitive, with ranges and
            # versions -- generated by the summary step above, in the clean
            # context, before anything here committed.
            cat deps-summary.md
            echo
            echo '<details><summary>package.json diffstat</summary>'
            echo
            echo '```'
            cat deps-stat.txt
            echo '```'
            echo
            echo '</details>'
            echo
            echo 'Review the direct moves above for anything surprising; the lockfile'
            echo 'churn underneath them is expected and not worth reading line by line.'
            echo
            echo '---'
            echo '_Opened by the weekly `npm-update` workflow._'
          } > body.md

          # `gh pr edit` failing here (a transient API error) must not strand
          # the PR on its placeholder body under `set -e` — the assignment
          # and review request below still have to run, because the assignee
          # is how an unattended PR gets seen. Retry, then downgrade to a
          # loud note: a placeholder body with a red warning beats no
          # assignee at all.
          edited=false
          for _ in 1 2 3; do
            if gh pr edit "$pr" --title "$title" --body-file body.md; then
              edited=true
              break
            fi
            sleep 5
          done
          if [ "$edited" != true ]; then
            echo "::warning::Could not publish the PR body for #$pr; it still carries the placeholder."
            echo "PR body update failed for #$pr — placeholder body remains." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Put it in front of a human. Without this the PR only exists in the
          # repo's PR list, which is precisely where a weekly unattended job
          # goes unnoticed — and an unreviewed dependency PR sitting open is the
          # failure this whole design is trying to avoid.
          #
          # The owner comes from `github.repository_owner` rather than a
          # hard-coded handle, so this file stays identical across the three
          # repos and does not go stale if the account is ever renamed.
          #
          # Deliberately non-fatal. A review request can be refused for reasons
          # that have nothing to do with this batch — the requestee must be a
          # collaborator, and GitHub silently drops a request when the requestee
          # is the PR's own author — and the branch is already pushed by this
          # point. An opened-but-unassigned PR is recoverable; a failed step
          # that leaves a pushed branch with no PR is not.
          reviewer='${{ github.repository_owner }}'
          if ! gh pr edit "$pr" --add-assignee "$reviewer" --add-reviewer "$reviewer"; then
            echo "Could not assign or request review from @$reviewer — the PR is open and needs a look." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
