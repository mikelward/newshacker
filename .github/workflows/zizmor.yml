# Scan of the workflows with zizmor (https://docs.zizmor.sh).
#
# Advisory today, but the trigger below is already the required shape:
# TODO.md's "Make zizmor a required check, not just advisory" tracks making
# `zizmor` one of the ruleset's required status checks, same as
# `lanes`/`codex`, and its first sub-item — widening this trigger — is what
# this comment documents. That is why there is no `paths:` filter: a
# workflow filtered out by paths creates NO check run at all (unlike a
# skipped job, which reports "skipped" and satisfies a ruleset), so a
# required `zizmor` plus a path filter would leave any pull request not
# touching `.github/**` waiting forever on a check nothing reports. The scan
# is a free sub-minute job, so it simply runs on every pull request and
# every push to main. Until the ruleset itself lists `zizmor` (TODO.md's
# remaining sub-items), a red scan here is a finding to read, not yet a gate.
#
# The version is pinned because a new zizmor release adds audits, so an
# unpinned run could turn red with no change in this repository. Bump it
# deliberately and re-read the findings. Policy exceptions live in
# .github/zizmor.yml, beside this file.
#
# Cost and reliability: PyPI is free, keyless, and unmetered, so this is
# $0/month at any run volume. A cold pipx install-and-scan typically finishes
# in well under a minute; the 5-minute timeout is headroom for a slow PyPI
# resolve, not the expected case. The one failure mode is a PyPI outage:
# fetching zizmor is the only network step (--offline covers the scan
# itself); it cannot block a merge today, since nothing requires this check
# yet, but TODO.md's second sub-item is deciding whether that changes.
#
# `pull_request` lists its types explicitly because the default set lacks
# `edited`: a retarget regenerates the merge ref against the new base while
# the head -- and the green `zizmor` check already attached to it -- stays
# put, so without `edited` the old target's scan would satisfy the new one
# unexamined. Title and body edits re-run the scan too; redundant but
# cheap.
name: zizmor
#
# `workflow_dispatch` is what keeps the weekly dependency batch mergeable.
# That PR is opened by `GITHUB_TOKEN`, whose events start no workflows, so
# `pull_request` never fires for it — and a required check that never runs
# holds the PR open forever rather than failing it. mikelward/npm-update
# dispatches this explicitly, named in npm-update.yml's `dispatch-workflows`;
# the trigger has to be visible on the DEFAULT BRANCH for that call to
# resolve, however the branch under test spells it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # --offline, so the scan talks to nothing: the audits that need the
      # GitHub API are skipped, deterministically, and the only fetch is
      # zizmor itself.
      - name: Scan the workflows
        run: pipx run --spec zizmor==1.30.0 zizmor --no-progress --offline .
