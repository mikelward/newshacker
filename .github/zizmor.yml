# Policy for zizmor; the advisory workflow beside this file runs it.
#
# The defaults demand hash pins everywhere and refuse pull_request_target
# outright. Both collide with decisions made deliberately across this
# fleet of repos, so the exceptions live here, scoped as narrowly as the
# tool allows.
rules:
  unpinned-uses:
    config:
      policies:
        # `@main` IS the release for these sibling actions: this repo tracks
        # them deliberately, there is no release step on their side, and a
        # pin would be a thing to bump here on every one of their merges.
        # Enumerated by name, not `mikelward/*` — owner-wide would also
        # excuse a future workflow pulling any sibling at a mutable ref, and
        # each exemption should be a decision somebody made.
        # Two keys for codex-review: zizmor matches a reusable-workflow call
        # on its full path, not just `owner/repo`, so the actions-style use
        # in codex-review.yml and the reusable-workflow call in
        # codex-review-check.yml each need their own entry.
        "mikelward/codex-review": ref-pin
        "mikelward/codex-review/.github/workflows/check-consumer.yml": ref-pin
        "mikelward/lanes": ref-pin
        # Same reasoning as codex-review above: this repo tracks the
        # reusable workflow deliberately, there is no release step on its
        # side, and a pin would be a thing to bump here on every merge
        # there.
        "mikelward/npm-update/.github/workflows/npm-update.yml": ref-pin
        # Official actions may pin to a tag, as every workflow here does.
        # Hash-pinning them instead is a deliberate open question, tracked
        # the same way mikelward/codex-review tracks it for itself.
        "actions/*": ref-pin
        # Everything else must pin to a hash.
        "*": hash-pin
  secrets-inherit:
    # The weekly batch caller passes `secrets: inherit` on purpose: the
    # publish job of the called workflow reads NPM_UPDATE_PAT from this
    # repository's `npm-update` environment, and an environment secret
    # reaches a called workflow no other way. The alternative zizmor prefers
    # -- naming the secret in a `secrets:` block -- delivers it to the runner
    # of every job in the called workflow, the untrusted update job included,
    # which is the exposure the environment exists to close. The price of
    # `inherit` is that every repository-level secret here reaches that job
    # too, so this repository keeps its secrets environment-scoped
    # (mikelward/repo's `repo audit` reports any that are not).
    ignore:
      - npm-update.yml
  dangerous-triggers:
    # These pull_request_target triggers are load-bearing and reasoned
    # through in each workflow's own header: neither checks out or
    # executes pull request code with the elevated token.
    ignore:
      - codex-review.yml
      - codex-review-check.yml
