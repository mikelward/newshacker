# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Prose cannot
# change a build, but being prose is a matter of WHERE a file lives, not of
# its extension: markdown is docs at the root and in the prose trees named
# below, and code anywhere else. Anything under src/, api/, or public/ is a
# build input whatever its extension (Vite can import any file, api/ deploys
# as functions, public/ ships verbatim), and markdown in some future tree
# could be one too — which is why the docs rules name their trees rather
# than matching *.md at any depth. Everything else is code — including
# .gitignore: ignore rules can hide files from CI's own staging steps.
code src/**
code api/**
code public/**
# The root plus the two prose trees. The asymmetry is deliberate: `*.md`
# does not cross `/`, so it reaches the root and no further, while the tree
# rules use `**` so each reaches every depth below its own directory and
# nowhere else. Writing a tree rule `docs/*.md` looks tidier and is a trap --
# it puts a file one level down on the code lane. A bare `**/*.md` is the
# opposite mistake: it makes a markdown build input documentation at any
# depth. reports/ is named alongside docs/ because it is the same thing --
# a directory that holds nothing but prose.
docs *.md
docs docs/**/*.md
docs reports/**/*.md

# The subject prefixes this repo's commit conventions give housekeeping
# commits (see AGENTS.md "Commit messages"). On the docs lane every commit
# must carry one, so nothing on this lane can ever read like a bare
# behavior-change subject.
prefixes deps docs todo test build refactor

# This repo's workflow_dispatch has one caller — the weekly dependency job's
# publish step, which opens the PR first precisely so its dispatch can name
# it — so a PR-less dispatch is never legitimate, on any ref.
dispatch-without-pr refuse

# The pull request title is never linted. Squash merging is disabled on every
# repository in this fleet, so a title never becomes a commit subject; only
# the commit prefixes above decide what may ride the docs lane.
lint-title no
