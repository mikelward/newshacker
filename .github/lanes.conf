# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown is docs
# wherever it lives OUTSIDE the shipped trees — prose cannot change a build —
# while anything under src/, api/, or public/ is a build input whatever its
# extension (Vite can import any file, api/ deploys as functions, public/
# ships verbatim). Everything else is code — including .gitignore: ignore
# rules can hide files from CI's own staging steps.
code src/**
code api/**
code public/**
docs **/*.md

# The subject prefixes this repo's commit conventions give housekeeping
# commits (see AGENTS.md "Commit messages"). On the docs lane every commit
# must carry one, so nothing on this lane can ever read like a bare
# behavior-change subject.
prefixes deps docs todo test build refactor

# This repo's workflow_dispatch has one caller — the weekly dependency job's
# publish step, which opens the PR first precisely so its dispatch can name
# it — so a PR-less dispatch is never legitimate, on any ref.
dispatch-without-pr refuse
